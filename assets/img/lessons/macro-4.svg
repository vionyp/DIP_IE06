<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#7a4fbf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Sector forecast: industry sales bars climb and a forecast arrow points to AI-led growth</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 6s ease-in-out infinite backwards}
.d1{animation-delay:.25s}.d2{animation-delay:.5s}.d3{animation-delay:.75s}.d4{animation-delay:1s}.d5{animation-delay:1.25s}
.arrow{stroke-dasharray:100;animation:arrow 6s ease-in-out infinite}
.tail{animation:tail 6s ease-in-out infinite}
.badge{animation:bob 3s ease-in-out infinite alternate}
.trail{animation:march 2s linear infinite}
@keyframes bar{0%{transform:scaleY(.05)}16%,88%{transform:scaleY(1)}100%{transform:scaleY(.05)}}
@keyframes arrow{0%,40%{stroke-dashoffset:100}65%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes tail{0%,60%{opacity:0}68%,88%{opacity:1}100%{opacity:0}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
@keyframes march{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<rect x="40" y="34" width="380" height="190" rx="16" fill="#ffffff"/>
<text x="60" y="70" font-size="26" fill="#7a4fbf">Industry sales</text>
<path d="M60 200h340"/>
<rect class="bar" x="68" y="120" width="36" height="80" rx="5" fill="#efe8f9"/>
<rect class="bar d1" x="118" y="150" width="36" height="50" rx="5" fill="#efe8f9"/>
<rect class="bar d2" x="168" y="138" width="36" height="62" rx="5" fill="#efe8f9"/>
<rect class="bar d3" x="218" y="116" width="36" height="84" rx="5" fill="#efe8f9"/>
<rect class="bar d4" x="280" y="100" width="36" height="100" rx="5" fill="#fdebd3" stroke="#e8963f" stroke-dasharray="6 8"/>
<rect class="bar d5" x="336" y="84" width="36" height="116" rx="5" fill="#fdebd3" stroke="#e8963f" stroke-dasharray="6 8"/>
<path class="arrow" pathLength="100" d="M268 78l26-14 18 8 42-30" stroke="#e8963f" stroke-width="5"/>
<path class="tail" d="M340 42h14v14" stroke="#e8963f" stroke-width="5"/>
<path class="trail" d="M434 120h28" stroke-width="4" stroke-dasharray="2 12"/>
<path d="M456 108l12 12-12 12" stroke-width="4"/>
<g class="badge"><circle cx="540" cy="118" r="56" fill="#fdebd3" stroke="#e8963f"/>
<text x="540" y="130" font-size="34" fill="#c97a26" text-anchor="middle">+13%</text></g>
<text x="540" y="242" font-size="26" fill="#7a4fbf" text-anchor="middle">AI demand</text>
</svg>
