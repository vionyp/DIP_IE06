<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#2c4a7c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Split and buyback: a share pie is cut into 10 slices and one is bought back, lifting EPS</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.slice{transform-box:fill-box;transform-origin:center;opacity:0;animation:slice 6s ease-in-out infinite}
.trail{animation:march 2s linear infinite}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 6s ease-in-out infinite}
.up{animation:up 6s ease-in-out infinite}
@keyframes slice{0%{transform:none;opacity:0}6%{opacity:1}40%{transform:translate(290px,20px) scale(.5);opacity:1}46%{transform:translate(290px,20px) scale(.4);opacity:0}100%{transform:none;opacity:0}}
@keyframes march{to{stroke-dashoffset:-28}}
@keyframes grow{0%,48%{transform:scaleY(.7)}64%,88%{transform:scaleY(1)}100%{transform:scaleY(.7)}}
@keyframes up{0%,54%{transform:translateY(12px);opacity:0}68%,88%{transform:translateY(0);opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<!-- pie cut in 10 -->
<circle cx="150" cy="130" r="70" fill="#ffffff"/>
<path d="M80 130H220M93.4 171.2L206.6 88.8M128.4 196.6L171.6 63.4M171.6 196.6L128.4 63.4M93.4 88.8L206.6 171.2" stroke-width="3"/>
<path d="M150 130L128.4 63.4A70 70 0 0 1 171.6 63.4z" fill="#fbf7ef" stroke="#c9c2b3" stroke-width="3" stroke-dasharray="6 8"/>
<path class="slice" d="M150 130L128.4 63.4A70 70 0 0 1 171.6 63.4z" fill="#fdebd3" stroke="#e8963f"/>
<text x="150" y="240" font-size="26" fill="#d97a2e" text-anchor="middle">10-for-1 split</text>
<!-- trail -->
<path class="trail" d="M232 96Q300 44 366 90" stroke-width="4" stroke-dasharray="2 12"/>
<path d="M354 80l12 10-14 6" stroke-width="4"/>
<!-- EPS card -->
<rect x="384" y="34" width="222" height="190" rx="16" fill="#ffffff"/>
<text x="404" y="70" font-size="26" fill="#d97a2e">EPS</text>
<path d="M404 200h184"/>
<rect x="414" y="130" width="40" height="70" rx="5" fill="#e8eef7"/>
<rect class="bar" x="474" y="100" width="40" height="100" rx="5" fill="#fdebd3" stroke="#e8963f"/>
<g class="up" stroke="#e8963f" stroke-width="4.5">
<path d="M530 176l12-16 10 8 18-28M562 134h14v14"/>
</g>
</svg>
