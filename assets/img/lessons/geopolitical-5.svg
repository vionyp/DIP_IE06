<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#2c4a7c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Government as buyer: an order flies from a government building to a growing row of AI servers</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.order{transform-box:fill-box;transform-origin:center;animation:order 6s ease-in-out infinite}
.rack3{animation:rack 6s ease-out infinite}
.led{animation:led 2.4s ease-in-out infinite}
.l2{animation-delay:-.6s}.l3{animation-delay:-1.2s}.l4{animation-delay:-1.8s}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 6s ease-in-out infinite}
@keyframes order{0%{transform:translate(-110px,48px) scale(.5);opacity:0}10%{opacity:1}28%{transform:translate(-50px,10px) scale(1)}42%{transform:translate(0,0) scale(1)}58%{transform:translate(130px,-6px) scale(.7);opacity:1}68%,100%{transform:translate(188px,4px) scale(.3);opacity:0}}
@keyframes rack{0%,62%{transform:translateY(-36px);opacity:0}74%,92%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spark{0%,70%{transform:scale(.3);opacity:0}80%{transform:scale(1.1);opacity:1}92%,100%{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.spark{opacity:0}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<path d="M28 206h584"/>
<!-- government building -->
<path d="M118 60V36"/>
<path d="M118 36h22l-6 7 6 7h-22z" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<path d="M40 104l78-44 78 44z" fill="#ffffff"/>
<rect x="50" y="104" width="136" height="14" rx="3" fill="#e8eef7"/>
<rect x="62" y="118" width="16" height="62" rx="3" fill="#ffffff"/>
<rect x="92" y="118" width="16" height="62" rx="3" fill="#ffffff"/>
<rect x="128" y="118" width="16" height="62" rx="3" fill="#ffffff"/>
<rect x="158" y="118" width="16" height="62" rx="3" fill="#ffffff"/>
<rect x="44" y="180" width="148" height="13" rx="3" fill="#ffffff"/>
<rect x="36" y="193" width="164" height="13" rx="3" fill="#ffffff"/>
<!-- trail -->
<path d="M210 112Q300 10 480 70" stroke="#e8963f" stroke-width="3" stroke-dasharray="2 12" opacity=".7"/>
<!-- order slip -->
<g class="order">
<rect x="256" y="20" width="100" height="88" rx="8" fill="#ffffff"/>
<path d="M256 52h100" stroke-width="3"/>
<text x="306" y="45" font-size="22" fill="#2c4a7c" text-anchor="middle">ORDER</text>
<path d="M276 66h40M276 80h28M276 94h34" stroke-width="3"/>
<path d="M326 82l6 6 10-12" stroke="#e8963f" stroke-width="4"/>
</g>
<!-- server racks -->
<g>
<rect x="402" y="64" width="56" height="142" rx="6" fill="#ffffff"/>
<rect x="412" y="78" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<rect x="412" y="108" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<rect x="412" y="138" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<rect x="412" y="168" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<g fill="#e8963f" stroke="none"><circle class="led" cx="440" cy="89" r="4"/><circle class="led l2" cx="440" cy="119" r="4"/><circle class="led l3" cx="440" cy="149" r="4"/><circle class="led l4" cx="440" cy="179" r="4"/></g>
<rect x="466" y="64" width="56" height="142" rx="6" fill="#ffffff"/>
<rect x="476" y="78" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<rect x="476" y="108" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<rect x="476" y="138" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<rect x="476" y="168" width="36" height="22" rx="4" fill="#e8eef7" stroke-width="3"/>
<g fill="#e8963f" stroke="none"><circle class="led l3" cx="504" cy="89" r="4"/><circle class="led" cx="504" cy="119" r="4"/><circle class="led l4" cx="504" cy="149" r="4"/><circle class="led l2" cx="504" cy="179" r="4"/></g>
</g>
<g class="rack3">
<rect x="530" y="64" width="56" height="142" rx="6" fill="#ffffff"/>
<rect x="540" y="78" width="36" height="22" rx="4" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<rect x="540" y="108" width="36" height="22" rx="4" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<rect x="540" y="138" width="36" height="22" rx="4" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<rect x="540" y="168" width="36" height="22" rx="4" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
</g>
<g class="spark" stroke="#e8963f" stroke-width="3"><path d="M604 40v18M595 49h18M586 70v8M582 74h8"/></g>
<text x="494" y="238" font-size="26" fill="#2c4a7c" text-anchor="middle">AI servers</text>
</svg>
