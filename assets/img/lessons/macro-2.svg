<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#7a4fbf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Inflation data: a hot CPI thermometer tips the seesaw and chip stocks drop</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.merc{transform-box:fill-box;transform-origin:50% 100%;animation:merc 6s ease-in-out infinite}
.plank{transform-origin:450px 166px;animation:plank 6s ease-in-out infinite}
.down{animation:down 6s ease-in-out infinite}
@keyframes merc{0%{transform:scaleY(.3)}40%,88%{transform:scaleY(1)}100%{transform:scaleY(.3)}}
@keyframes plank{0%{transform:rotate(-10deg)}43%{transform:rotate(11deg)}48%{transform:rotate(9deg)}53%,88%{transform:rotate(10deg)}100%{transform:rotate(-10deg)}}
@keyframes down{0%,45%{transform:translateY(-12px);opacity:0}58%,88%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.plank{transform:rotate(10deg)}}
</style>
