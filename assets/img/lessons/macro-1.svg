<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#7a4fbf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Rate hikes: a rising interest rate dial pulls a chip stock balloon down</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.needle{transform-origin:130px 176px;animation:needle 6s ease-in-out infinite}
.bal{animation:bal 6s ease-in-out infinite}
.down{animation:down 6s ease-in-out infinite}
@keyframes needle{0%{transform:rotate(-50deg)}45%,88%{transform:rotate(50deg)}100%{transform:rotate(-50deg)}}
@keyframes bal{0%{transform:translateY(-60px)}45%,88%{transform:translateY(0)}100%{transform:translateY(-60px)}}
@keyframes down{0%,40%{transform:translateY(-12px);opacity:0}55%,88%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.needle{transform:rotate(50deg)}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<path d="M28 206h584"/>
<rect x="74" y="176" width="112" height="30" rx="8" fill="#efe8f9"/>
<path d="M64 176a66 66 0 0 1 132 0z" fill="#ffffff"/>
<path d="M78 138l8 8M130 108v12M182 138l-8 8" stroke-width="3"/>
<g class="needle"><path d="M130 176V124" stroke="#e8963f" stroke-width="5"/></g>
<circle cx="130" cy="176" r="9" fill="#fdebd3" stroke="#e8963f"/>
<text x="130" y="242" font-size="26" fill="#7a4fbf" text-anchor="middle">Fed rate</text>
<g class="down" stroke="#c0392b" stroke-width="4"><path d="M320 80v54M308 122l12 14 12-14"/></g>
<g class="bal">
<path d="M470 172v18" stroke-width="3"/>
<rect x="454" y="190" width="32" height="16" rx="4" fill="#efe8f9"/>
<path d="M462 172l8-8 8 8z" fill="#ffffff"/>
<ellipse cx="470" cy="112" rx="46" ry="52" fill="#ffffff"/>
<rect x="452" y="94" width="36" height="36" rx="5" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/><rect x="462" y="104" width="16" height="16" rx="2" stroke="#e8963f" stroke-width="3"/><path stroke="#e8963f" stroke-width="3" d="M446 102h6M446 112h6M446 122h6M488 102h6M488 112h6M488 122h6"/>
</g>
<text x="470" y="242" font-size="26" fill="#7a4fbf" text-anchor="middle">Chip stocks</text>
</svg>
