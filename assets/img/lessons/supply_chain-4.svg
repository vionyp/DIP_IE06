<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#1f9a94" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Company dashboard: utilisation, margin and revenue rise together</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.needle{transform-origin:116px 150px;animation:nd 5s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:0% 50%;animation:bar 5s ease-in-out infinite}
.line{animation:ln 5s ease-in-out infinite}
.up{animation:up 5s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 2.4s ease-in-out infinite alternate}
@keyframes nd{0%,8%{transform:rotate(-85deg)}45%,88%{transform:rotate(0)}100%{transform:rotate(-85deg)}}
@keyframes bar{0%,8%{transform:scaleX(.55)}45%,88%{transform:scaleX(1)}100%{transform:scaleX(.55)}}
@keyframes ln{0%,8%{stroke-dashoffset:1}45%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@keyframes up{0%,40%{opacity:0}52%,88%{opacity:1}100%{opacity:0}}
@keyframes dot{from{transform:scale(.8)}to{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<rect x="28" y="34" width="176" height="176" rx="16" fill="#ffffff"/>
<rect x="232" y="34" width="176" height="176" rx="16" fill="#ffffff"/>
<rect x="436" y="34" width="176" height="176" rx="16" fill="#ffffff"/>
<!-- gauge -->
<path d="M60 150a56 56 0 0 1 112 0" stroke="#d3ebe9" stroke-width="12"/>
<path d="M116 94v10" stroke-width="3"/>
<g transform="rotate(40 116 150)"><g class="needle"><path d="M116 150V106" stroke-width="4.5"/></g></g>
<circle cx="116" cy="150" r="8" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<!-- margin bar -->
<rect x="248" y="132" width="144" height="24" rx="12" fill="#e0f2f1" stroke-width="3"/>
<rect class="bar" x="248" y="132" width="124" height="24" rx="12" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<path d="M328 122v44" stroke="#c9c2b3" stroke-width="3" stroke-dasharray="6 8"/>
<g class="up" stroke="#e8963f" stroke-width="4"><path d="M264 104l18-14 12 8 20-18M304 80h12v12"/></g>
<!-- revenue line -->
<path d="M466 192h116" stroke-width="3"/>
<path class="line" pathLength="1" d="M472 176L498 158L522 166L552 126L580 92" stroke="#e8963f" stroke-width="4.5" stroke-dasharray="1"/>
<circle class="dot" cx="580" cy="92" r="6" fill="#e8963f" stroke="none"/>
<text x="116" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Utilisation</text>
<text x="320" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Margin</text>
<text x="524" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Revenue</text>
</svg>
