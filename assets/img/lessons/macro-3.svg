<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#7a4fbf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Inventory glut: a warehouse fills with unsold chip boxes while the order line falls</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.bx{transform-box:fill-box;transform-origin:50% 100%;animation:bx 6s ease-in-out infinite backwards}
.b2{animation-delay:.4s}.b3{animation-delay:.8s}
.ord{stroke-dasharray:100;animation:ord 6s ease-in-out infinite}
.end{transform-box:fill-box;transform-origin:center;animation:end 6s ease-out infinite}
@keyframes bx{0%{transform:translateY(-26px);opacity:0}14%{transform:translateY(0);opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes ord{0%{stroke-dashoffset:100}50%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes end{0%,48%{transform:scale(0);opacity:0}58%,88%{transform:scale(1);opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<path d="M28 206h312"/>
<path d="M38 114L145 70l107 44z" fill="#e8eef7"/>
<rect x="50" y="112" width="190" height="94" fill="#ffffff"/>
<rect x="72" y="134" width="146" height="72" rx="4" fill="#efe8f9"/>
<g stroke="#e8963f" stroke-width="3" fill="#fdebd3">
<g class="bx"><rect x="78" y="172" width="40" height="34" rx="4"/><rect x="78" y="138" width="40" height="34" rx="4"/></g>
<g class="bx b2"><rect x="124" y="172" width="40" height="34" rx="4"/><rect x="124" y="138" width="40" height="34" rx="4"/></g>
<g class="bx b3"><rect x="170" y="172" width="40" height="34" rx="4"/><rect x="170" y="138" width="40" height="34" rx="4"/></g>
</g>
<text x="145" y="242" font-size="26" fill="#7a4fbf" text-anchor="middle">Unsold chips</text>
<rect x="340" y="34" width="268" height="190" rx="16" fill="#ffffff"/>
<text x="360" y="70" font-size="26" fill="#7a4fbf">Chip orders</text>
<path d="M360 200h228"/>
<path d="M366 96L580 70" stroke="#c9c2b3" stroke-width="3" stroke-dasharray="6 8"/>
<path class="ord" pathLength="100" d="M366 96L416 92L462 124L516 150L568 182" stroke="#c0392b" stroke-width="5"/>
<circle class="end" cx="568" cy="182" r="8" fill="#f8dcd8" stroke="#c0392b"/>
</svg>
