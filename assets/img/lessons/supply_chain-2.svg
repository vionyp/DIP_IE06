<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#1f9a94" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Supply chain: one blocked link slows every company downstream and the stock falls</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 3s ease-out infinite}
.link{animation:march 2s linear infinite}
.bang{animation:blink 1.4s ease-in-out infinite alternate}
.t2{animation:t2 6s ease-in-out infinite}
.t3{animation:t3 6s ease-in-out infinite}
.t4{animation:t4 6s ease-in-out infinite}
@keyframes rip{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes march{to{stroke-dashoffset:-28}}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes t2{0%,8%{opacity:0}20%,88%{opacity:1}100%{opacity:0}}
@keyframes t3{0%,24%{opacity:0}38%,88%{opacity:1}100%{opacity:0}}
@keyframes t4{0%,42%{opacity:0}56%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rip{opacity:.5}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<!-- links -->
<g class="link" stroke-width="4" stroke-dasharray="2 12"><path d="M146 136h64M300 136h64M456 136h64"/></g>
<!-- ripple at the jam -->
<rect class="rip" x="215" y="96" width="80" height="80" rx="14" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 10"/>
<!-- nodes -->
<rect x="60" y="96" width="80" height="80" rx="14" fill="#ffffff"/>
<rect x="215" y="96" width="80" height="80" rx="14" fill="#ffffff"/>
<rect x="370" y="96" width="80" height="80" rx="14" fill="#ffffff"/>
<rect x="525" y="96" width="80" height="80" rx="14" fill="#ffffff"/>
<rect class="t2" x="215" y="96" width="80" height="80" rx="14" fill="#f8dcd8" stroke="#c0392b"/>
<rect class="t3" x="370" y="96" width="80" height="80" rx="14" fill="#f8dcd8" stroke="#c0392b"/>
<rect class="t4" x="525" y="96" width="80" height="80" rx="14" fill="#f8dcd8" stroke="#c0392b"/>
<!-- icons -->
<rect x="88" y="124" width="24" height="24" rx="4" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<path d="M82 130h6M82 142h6M112 130h6M112 142h6" stroke="#e8963f" stroke-width="3"/>
<rect x="237" y="124" width="36" height="28" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
<path d="M237 134h36M255 124v10" stroke="#c0392b" stroke-width="3"/>
<rect x="390" y="126" width="40" height="22" rx="3" fill="#e0f2f1" stroke-width="3"/>
<path d="M398 148v6M410 148v6M422 148v6" stroke-width="3"/>
<path d="M541 122l16 14 12-8 18 22M595 142v8h-10" stroke="#c0392b" stroke-width="4"/>
<!-- alarm -->
<g class="bang"><circle cx="255" cy="64" r="20" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><path d="M255 54v11M255 73v1" stroke="#c0392b" stroke-width="4.5"/></g>
<text x="100" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Fab</text>
<text x="255" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Packaging</text>
<text x="410" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Memory</text>
<text x="565" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Stock</text>
</svg>
