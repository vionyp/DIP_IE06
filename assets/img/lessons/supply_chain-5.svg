<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#1f9a94" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Valuation: earnings beat but expectations weigh more, so the price tag falls</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.beam{transform-origin:320px 70px;animation:tip 6s ease-in-out infinite}
.pl{animation:pl 6s ease-in-out infinite}
.pr{animation:pr 6s ease-in-out infinite}
.tag{transform-origin:560px 28px;animation:sway 3s ease-in-out infinite alternate}
@keyframes tip{0%,10%{transform:rotate(-14deg)}40%,88%{transform:rotate(0)}100%{transform:rotate(-14deg)}}
@keyframes pl{0%,10%{transform:translateY(37px)}40%,88%{transform:translateY(0)}100%{transform:translateY(37px)}}
@keyframes pr{0%,10%{transform:translateY(-37px)}40%,88%{transform:translateY(0)}100%{transform:translateY(-37px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<path d="M320 79V206M280 206h80"/>
<g transform="rotate(8 320 70)"><g class="beam"><path d="M170 70h300" stroke-width="5"/></g></g>
<circle cx="320" cy="70" r="9" fill="#ffffff"/>
<!-- left pan: earnings -->
<g transform="translate(0 -21)"><g class="pl">
<path d="M170 70l-40 80M170 70l40 80" stroke-width="3"/>
<path d="M130 150q40 30 80 0z" fill="#ffffff"/>
<g stroke="#e8963f" stroke-width="3" fill="#fdebd3"><ellipse cx="170" cy="144" rx="18" ry="6"/><ellipse cx="170" cy="134" rx="18" ry="6"/><ellipse cx="170" cy="124" rx="18" ry="6"/></g>
</g></g>
<!-- right pan: expectations -->
<g transform="translate(0 21)"><g class="pr">
<path d="M470 70l-40 80M470 70l40 80" stroke-width="3"/>
<path d="M430 150q40 30 80 0z" fill="#ffffff"/>
<path d="M452 150l6-32h24l6 32z" fill="#e0f2f1"/>
<path d="M470 126v14M463 133h14" stroke="#e8963f" stroke-width="3"/>
</g></g>
<!-- price tag -->
<path d="M548 24h24" stroke-width="5"/>
<g class="tag"><path d="M560 28v16" stroke-width="3"/><path d="M544 52q0-8 8-8h16q8 0 8 8v32q0 8-8 8h-16q-8 0-8-8z" fill="#ffffff"/><path d="M560 56v22M551 71l9 10 9-10" stroke="#c0392b" stroke-width="4"/></g>
<text x="170" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Earnings</text>
<text x="470" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Expectations</text>
</svg>
