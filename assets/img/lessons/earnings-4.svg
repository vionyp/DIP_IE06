<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#2f8f5b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Four chip company types, each with its own gauge: fabless, foundry, memory and equipment</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.g{transform-box:fill-box;transform-origin:0 50%;animation:gauge 4s ease-in-out infinite alternate}
.g2{animation-delay:-1s}.g3{animation-delay:-2s}.g4{animation-delay:-3s}
.beam{animation:flick 1.6s ease-in-out infinite alternate}
@keyframes gauge{from{transform:scaleX(.45)}to{transform:scaleX(1)}}
@keyframes flick{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<!-- tiles -->
<g fill="#ffffff">
<rect x="32" y="36" width="126" height="168" rx="16"/>
<rect x="182" y="36" width="126" height="168" rx="16"/>
<rect x="332" y="36" width="126" height="168" rx="16"/>
<rect x="482" y="36" width="126" height="168" rx="16"/>
</g>
<!-- fabless chip -->
<g stroke="#e8963f" stroke-width="3">
<rect x="71" y="58" width="48" height="48" rx="7" fill="#fdebd3"/>
<rect x="85" y="72" width="20" height="20" rx="3"/>
<path d="M82 50v8M95 50v8M108 50v8M82 106v8M95 106v8M108 106v8M63 69h8M63 82h8M63 95h8M119 69h8M119 82h8M119 95h8"/>
</g>
<!-- foundry fab -->
<path d="M209 116V84l24-18v18l24-18v18l24-18v50z" fill="#e8eef7"/>
<rect x="238" y="96" width="18" height="20" rx="3" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<!-- memory stick -->
<rect x="356" y="68" width="78" height="38" rx="6" fill="#ffffff"/>
<g fill="#fdebd3" stroke="#e8963f" stroke-width="3">
<rect x="366" y="77" width="14" height="18" rx="2"/>
<rect x="388" y="77" width="14" height="18" rx="2"/>
<rect x="410" y="77" width="14" height="18" rx="2"/>
</g>
<path d="M366 106v10M378 106v10M390 106v10M402 106v10M414 106v10M426 106v10" stroke-width="3"/>
<!-- equipment tool -->
<rect x="510" y="106" width="70" height="12" rx="4" fill="#e8eef7"/>
<path d="M524 106V70h36"/>
<rect x="550" y="64" width="20" height="16" rx="3" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/>
<path class="beam" d="M560 84v18" stroke="#e8963f" stroke-width="4" stroke-dasharray="2 8"/>
<!-- gauges -->
<g stroke="none" fill="#e8eef7">
<rect x="48" y="150" width="94" height="16" rx="8"/>
<rect x="198" y="150" width="94" height="16" rx="8"/>
<rect x="348" y="150" width="94" height="16" rx="8"/>
<rect x="498" y="150" width="94" height="16" rx="8"/>
</g>
<g stroke="none" fill="#2f8f5b">
<rect class="g" x="48" y="150" width="70" height="16" rx="8"/>
<rect class="g g2" x="198" y="150" width="84" height="16" rx="8"/>
<rect class="g g3" x="348" y="150" width="58" height="16" rx="8"/>
<rect class="g g4" x="498" y="150" width="76" height="16" rx="8"/>
</g>
<g font-size="22" fill="#2f8f5b" text-anchor="middle">
<text x="95" y="232">Fabless</text>
<text x="245" y="232">Foundry</text>
<text x="395" y="232">Memory</text>
<text x="545" y="232">Equipment</text>
</g>
</svg>
