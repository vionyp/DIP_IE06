<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" stroke="#1f9a94" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<title>Chip cycle: a chip rides the wave from boom to glut and back</title>
<style>
text{font-family:system-ui,"Segoe UI",sans-serif;font-weight:700;stroke:none}
.ride{offset-path:path("M40 130C90 40 170 40 220 130S350 220 400 130S530 40 600 130");offset-rotate:0deg;animation:ride 8s linear infinite}
.sp{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite alternate}
@keyframes ride{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes tw{from{transform:scale(.6);opacity:.5}to{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ride{offset-distance:25%}}
</style>
<rect x="8" y="8" width="624" height="244" rx="28" fill="#fbf7ef" stroke="none"/>
<path d="M28 130h584" stroke="#c9c2b3" stroke-width="3" stroke-dasharray="6 8"/>
<path d="M40 130C90 40 170 40 220 130S350 220 400 130S530 40 600 130" stroke-width="4.5"/>
<g class="sp" stroke="#e8963f" stroke-width="3"><path d="M493 28v14M486 35h14"/></g>
<text x="130" y="112" font-size="26" fill="#1f9a94" text-anchor="middle">Boom</text>
<text x="310" y="162" font-size="26" fill="#1f9a94" text-anchor="middle">Glut</text>
<g class="ride"><rect x="-14" y="-34" width="28" height="28" rx="4" fill="#fdebd3" stroke="#e8963f" stroke-width="3"/><rect x="-6" y="-26" width="12" height="12" rx="2" stroke="#e8963f" stroke-width="2.5"/><path d="M-20 -28h6M-20 -12h6M14 -28h6M14 -12h6" stroke="#e8963f" stroke-width="3"/></g>
<text x="310" y="240" font-size="26" fill="#1f9a94" text-anchor="middle">Demand vs supply</text>
</svg>
